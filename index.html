<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro para el Sorteo</title>
    <!-- Tailwind CSS (CDN para prototipado rápido) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Oficial de Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <!-- Título Dinámico del Evento -->
        <h1 id="titulo-evento" class="text-2xl font-bold text-center text-indigo-400 mb-6">
            Cargando evento...
        </h1>

        <!-- Contenedor de Mensaje de Bloqueo (Oculto por defecto) -->
        <div id="mensaje-bloqueo" class="hidden bg-amber-600/30 border border-amber-500 text-amber-200 text-center p-4 rounded-lg mb-6 text-sm font-medium">
            <!-- Texto dinámico cuando el evento está finalizado o no existe -->
        </div>

        <!-- Formulario de Registro -->
        <form id="registro-form" onsubmit="registrarParticipante(event)" class="space-y-4">
            <div>
                <label for="nombre" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
                    Nombre Completo
                </label>
                <input type="text" id="nombre" required placeholder="Ej. Carlos Mendoza"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label for="cedula" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
                    Cédula de Identidad
                </label>
                <input type="text" id="cedula" required placeholder="Ej. 0912345678"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label for="telefono" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
                    Teléfono / WhatsApp
                </label>
                <input type="tel" id="telefono" required placeholder="Ej. 0987654321"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-indigo-600/30">
                Registrarme
            </button>
        </form>
    </div>

    <!-- LÓGICA DE INTERACCIÓN Y CONEXIÓN CON SUPABASE -->
    <script>
        // ============================================================================
        // 1. CONFIGURACIÓN E INICIALIZACIÓN DE SUPABASE
        // ============================================================================
        
        // Reemplaza estas dos cadenas con tus credenciales reales del panel de Supabase
        const SUPABASE_URL = "https://ibddqzzqlxsygyctqmcl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_t-F4Trlh63Q3OsBoIlNtiA_ffk17kbn";

        /*
         * EXPLICACIÓN PEDAGÓGICA:
         * Renombramos la variable a 'supabaseClient' para evitar la colisión de identificadores
         * con la librería global 'supabase' del CDN. Esto resuelve el 'Uncaught SyntaxError'.
         */
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variable global en memoria para mantener la referencia del ID activo en esta sesión
        let eventoIdActivo = null;

        // ============================================================================
        // 2. FUNCIONES DE INTERFAZ Y MANEJO DEL DOM
        // ============================================================================

        function mostrarMensajeBloqueo(mensaje) {
            const divBloqueo = document.getElementById('mensaje-bloqueo');
            const form = document.getElementById('registro-form');
            
            divBloqueo.innerText = mensaje;
            divBloqueo.classList.remove('hidden');
            
            // Ocultar los campos del formulario cuando el evento no permite registros
            form.classList.add('hidden');
        }

        function ocultarMensajeBloqueo() {
            const divBloqueo = document.getElementById('mensaje-bloqueo');
            const form = document.getElementById('registro-form');
            
            divBloqueo.classList.add('hidden');
            form.classList.remove('hidden');
        }

        // ============================================================================
        // 3. VERIFICACIÓN DINÁMICA DEL EVENTO
        // ============================================================================

        async function verificarEvento() {
        const urlParams = new URLSearchParams(window.location.search);
        const paramId = urlParams.get('evento_id');
    
        if (!paramId) {
            document.getElementById('titulo-evento').innerText = "Registro Deshabilitado";
            mostrarMensajeBloqueo("No se especificó un ID de evento en la URL.");
            return;
        }
    
        eventoIdActivo = parseInt(paramId, 10);
    
        try {
            /*
             * EXPLICACIÓN PEDAGÓGICA:
             * Cambiamos '.single()' por '.maybeSingle()'. 
             * '.single()' lanza un error HTTP 406 si la respuesta no contiene exactamente una fila.
             * '.maybeSingle()' retorna 'null' limpiamente en 'data' si no hay coincidencia,
             * permitiendo diferenciar entre un registro inexistente y un error de la API.
             */
            const { data: evento, error } = await supabaseClient
                .from('eventos')
                .select('*')
                .eq('id', eventoIdActivo)
                .maybeSingle();
    
            // LOG DE DEPURACIÓN CRÍTICO
            console.log("== DEPURACIÓN SUPABASE ==");
            console.log("ID consultado:", eventoIdActivo);
            console.log("Datos recibidos (evento):", evento);
            console.log("Error de la API (error):", error);
    
            if (error) {
                document.getElementById('titulo-evento').innerText = "Error de Consulta";
                mostrarMensajeBloqueo(`Error de la API de Supabase: ${error.message} (Código: ${error.code})`);
                return;
            }
    
            if (!evento) {
                document.getElementById('titulo-evento').innerText = "Evento No Encontrado";
                mostrarMensajeBloqueo(`El evento con ID #${eventoIdActivo} no existe en la base de datos.`);
                return;
            }
    
            // Si el evento existe y no hay errores:
            document.getElementById('titulo-evento').innerText = evento.nombre_evento;
    
            if (evento.estado !== 'EN_PROCESO') {
                mostrarMensajeBloqueo(`El evento "${evento.nombre_evento}" ha finalizado. No se aceptan más registros.`);
            } else {
                ocultarMensajeBloqueo();
            }
    
        } catch (err) {
            console.error("Excepción inesperada:", err);
            mostrarMensajeBloqueo("Error crítico al conectar con el servidor.");
        }
    }

        // ============================================================================
        // 4. INSERCIÓN DE PARTICIPANTES (OPERACIÓN DML)
        // ============================================================================

        async function registrarParticipante(event) {
            // Evitamos que el navegador recargue la página nativamente tras el submit
            event.preventDefault();

            if (!eventoIdActivo) {
                alert("Error: No hay un evento válido asociado para el registro.");
                return;
            }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Procesando...";

            const nombre = document.getElementById('nombre').value.trim();
            const cedula = document.getElementById('cedula').value.trim();
            const telefono = document.getElementById('telefono').value.trim();

            try {
                /*
                 * EXPLICACIÓN PEDAGÓGICA:
                 * Ejecutamos el 'INSERT' a la tabla 'participantes'. Si la cédula ya se encuentra
                 * registrada en este MISMO 'evento_id', la restricción UNIQUE del esquema lanzarás
                 * un error con código PostgreSQL '23505' (duplicate key), previniendo duplicados.
                 */
                const { data, error } = await supabaseClient
                    .from('participantes')
                    .insert([
                        {
                            evento_id: eventoIdActivo,
                            nombre: nombre,
                            cedula: cedula,
                            telefono: telefono,
                            ganador: false
                        }
                    ]);

                if (error) {
                    // Manejo especializado para duplicados por cédula
                    if (error.code === '23505') {
                        throw new Error("Esta cédula ya se encuentra registrada en este evento.");
                    }
                    throw error;
                }

                alert("¡Registro completado con éxito! Ya estás participando.");
                document.getElementById('registro-form').reset();

            } catch (err) {
                console.error("Fallo al insertar participante:", err);
                alert("No se pudo completar el registro: " + err.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Registrarme";
            }
        }

        // Suscribir la verificación automática al ciclo de vida del DOM
        window.addEventListener('DOMContentLoaded', verificarEvento);
    </script>
</body>
</html>
